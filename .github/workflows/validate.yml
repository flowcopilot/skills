name: Validate skills

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# actions/checkout runs git init with a temporary HOME; this keeps git from printing
# the default branch hint on every run.
env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up toolchains
        uses: jdx/mise-action@df8210ba1f29954aed392b1087dace56ca1d7854

      - name: Validate all skill bundles
        run: |
          bun run check
          bun run check:reach
          bun test benchmarks/skills
          uv run --script scripts/validate.py
          lychee --offline --no-progress './**/*.md'
