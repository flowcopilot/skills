name: Validate skills

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up toolchains
        uses: jdx/mise-action@df8210ba1f29954aed392b1087dace56ca1d7854

      - name: Validate all skill bundles
        run: |
          bun run check
          uv run --script scripts/validate.py
          lychee --offline --no-progress './**/*.md'
