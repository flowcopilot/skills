name: Sync upstream skills

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SYNC_TOKEN: ${{ secrets.SKILLS_SYNC_TOKEN }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Regenerate skills
        run: bun run sync

      - name: Check generated files
        run: |
          bun run check
          git diff --check

      - name: Detect changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update the sync branch
        if: steps.changes.outputs.changed == 'true'
        env:
          SYNC_BRANCH: automation/sync-upstream-skills
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote_sha=$(git ls-remote --heads origin "$SYNC_BRANCH" | awk '{print $1}')
          git checkout -B "$SYNC_BRANCH"
          git add NOTICE.md upstreams.json skills
          git commit -m "chore(skills): sync upstream sources"
          if [ -n "$remote_sha" ]; then
            git push --force-with-lease="refs/heads/${SYNC_BRANCH}:${remote_sha}" origin "HEAD:${SYNC_BRANCH}"
          else
            git push origin "HEAD:${SYNC_BRANCH}"
          fi

      - name: Open or update the sync pull request
        if: steps.changes.outputs.changed == 'true' && env.SYNC_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.SYNC_TOKEN }}
          SYNC_BRANCH: automation/sync-upstream-skills
        run: |
          pull_request=$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number')
          if [ -z "$pull_request" ]; then
            gh pr create \
              --base main \
              --head "$SYNC_BRANCH" \
              --title "chore(skills): sync upstream sources" \
              --body "Automated refresh from the pinned Convex and Cloudflare source repositories. Review the generated instruction changes before merge."
          fi

      - name: Report the organization token restriction
        if: steps.changes.outputs.changed == 'true' && env.SYNC_TOKEN == ''
        env:
          COMPARE_URL: ${{ github.server_url }}/${{ github.repository }}/compare/main...automation/sync-upstream-skills?expand=1
        run: |
          {
            echo "## Upstream skill changes are ready"
            echo
            echo "The update branch was pushed, but the organization blocks pull requests from GITHUB_TOKEN."
            echo "[Open the pull request manually](${COMPARE_URL}), or add a SKILLS_SYNC_TOKEN repository secret."
          } >> "$GITHUB_STEP_SUMMARY"
